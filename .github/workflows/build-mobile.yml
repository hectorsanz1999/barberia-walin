name: Build Mobile Apps (iOS & Android)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  # ==========================================================
  # JOB 1: Compilación de iOS en Servidores Mac de Apple
  # ==========================================================
  build-ios:
    name: Compilar Proyecto iOS
    runs-on: macos-latest
    steps:
      - name: Descargar Código
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Instalar Dependencias
        run: npm install --legacy-peer-deps

      - name: Compilar Web
        run: npm run build

      - name: Sincronizar Capacitor iOS
        run: npx cap sync ios

      - name: Compilar con Xcode en Nube
        run: |
          xcodebuild -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            clean build

      - name: Comprimir paquete iOS
        run: |
          mkdir -p build-output
          zip -r build-output/BarberiaWalin-iOS.zip ios/App

      - name: Subir Artefacto iOS
        uses: actions/upload-artifact@v4
        with:
          name: BarberiaWalin-iOS-Build
          path: build-output/BarberiaWalin-iOS.zip
          retention-days: 14

  # ==========================================================
  # JOB 2: Generación automática de APK de Android
  # ==========================================================
  build-android:
    name: Generar APK Android
    runs-on: ubuntu-latest
    steps:
      - name: Descargar Código
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Instalar Dependencias
        run: npm install --legacy-peer-deps

      - name: Compilar Web
        run: npm run build

      - name: Sincronizar Capacitor Android
        run: npx cap sync android

      - name: Dar permisos a Gradle
        run: chmod +x android/gradlew

      - name: Compilar APK (Debug)
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Subir APK de Android
        uses: actions/upload-artifact@v4
        with:
          name: BarberiaWalin-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
