name: Build Mobile Apps (iOS & Android)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  # ==========================================================
  # JOB 1: Compilación de iOS en Servidores Mac de Apple
  # ==========================================================
  build-ios:
    name: Compilar Proyecto iOS
    runs-on: macos-latest
    steps:
      - name: Descargar Código
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Instalar Dependencias
        run: npm install --legacy-peer-deps

      - name: Compilar Web
        run: npm run build

      - name: Sincronizar Capacitor iOS
        run: npx cap sync ios

      - name: Compilar con Xcode en Nube
        run: |
          xcodebuild -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            clean build

      - name: Comprimir paquete iOS
        run: |
          mkdir -p build-output
          zip -r build-output/BarberiaWalin-iOS.zip ios/App

      - name: Subir Artefacto iOS
        uses: actions/upload-artifact@v4
        with:
          name: BarberiaWalin-iOS-Build
          path: build-output/BarberiaWalin-iOS.zip
          retention-days: 14

  # ==========================================================
  # JOB 2: Generación de DOS APKs (BarberiaWalin y BarberiaWalin-Admin)
  # ==========================================================
  build-android:
    name: Generar APKs (Barbería Walin & Barbería Walin Admin)
    runs-on: ubuntu-latest
    steps:
      - name: Descargar Código
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Instalar Dependencias
        run: npm install --legacy-peer-deps

      - name: Aplicar Icono Oficial de Barbería Walin
        run: |
          ICON=""
          if [ -f "public/pwa-512x512.png" ]; then
            ICON="public/pwa-512x512.png"
          elif [ -f "public/apple-touch-icon.png" ]; then
            ICON="public/apple-touch-icon.png"
          elif [ -f "public/favicon.png" ]; then
            ICON="public/favicon.png"
          fi
          if [ -n "$ICON" ]; then
            echo "Aplicando icono oficial: $ICON"
            for dir in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
              mkdir -p android/app/src/main/res/mipmap-${dir}
              cp "$ICON" android/app/src/main/res/mipmap-${dir}/ic_launcher.png
              cp "$ICON" android/app/src/main/res/mipmap-${dir}/ic_launcher_round.png
              cp "$ICON" android/app/src/main/res/mipmap-${dir}/ic_launcher_foreground.png
            done
          fi

      - name: Dar permisos a Gradle
        run: chmod +x android/gradlew

      # -------------------------------------------------------------
      # 1. Compilar APP CLIENTES: BarberiaWalin.apk
      # -------------------------------------------------------------
      - name: Compilar Web para Barbería Walin
        run: VITE_APP_MODE=client npm run build

      - name: Sincronizar Capacitor para Barbería Walin
        run: npx cap sync android

      - name: Configurar Nombre 'Barbería Walin'
        run: |
          sed -i 's/<string name="app_name">.*<\/string>/<string name="app_name">Barbería Walin<\/string>/g' android/app/src/main/res/values/strings.xml
          sed -i 's/<string name="title_activity_main">.*<\/string>/<string name="title_activity_main">Barbería Walin<\/string>/g' android/app/src/main/res/values/strings.xml

      - name: Generar APK BarberiaWalin.apk
        run: |
          cd android
          ./gradlew clean assembleDebug --no-daemon
          mkdir -p ../build-apks
          cp app/build/outputs/apk/debug/app-debug.apk ../build-apks/BarberiaWalin.apk

      # -------------------------------------------------------------
      # 2. Compilar APP ADMINISTRACIÓN: BarberiaWalin-Admin.apk
      # -------------------------------------------------------------
      - name: Compilar Web para Barbería Walin Admin
        run: VITE_APP_MODE=admin npm run build

      - name: Sincronizar Capacitor para Barbería Walin Admin
        run: npx cap sync android

      - name: Configurar Nombre e ID para 'Barbería Walin Admin'
        run: |
          sed -i 's/applicationId "com.barberiawalin.app"/applicationId "com.barberiawalin.admin"/g' android/app/build.gradle
          sed -i 's/<string name="app_name">.*<\/string>/<string name="app_name">Barbería Walin Admin<\/string>/g' android/app/src/main/res/values/strings.xml
          sed -i 's/<string name="title_activity_main">.*<\/string>/<string name="title_activity_main">Barbería Walin Admin<\/string>/g' android/app/src/main/res/values/strings.xml

      - name: Generar APK BarberiaWalin-Admin.apk
        run: |
          cd android
          ./gradlew clean assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../build-apks/BarberiaWalin-Admin.apk

      # -------------------------------------------------------------
      # 3. Subir ambos archivos .APK listos para descargar
      # -------------------------------------------------------------
      - name: Subir Instalador BarberiaWalin.apk
        uses: actions/upload-artifact@v4
        with:
          name: BarberiaWalin-APK
          path: build-apks/BarberiaWalin.apk
          retention-days: 14

      - name: Subir Instalador BarberiaWalin-Admin.apk
        uses: actions/upload-artifact@v4
        with:
          name: BarberiaWalin-Admin-APK
          path: build-apks/BarberiaWalin-Admin.apk
          retention-days: 14
